services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpt_clone_langgraph
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
